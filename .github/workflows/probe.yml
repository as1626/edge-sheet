name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://api.the-odds-api.com/v4/sports \
                   "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
                   "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries" \
                   "https://stats.nba.com/stats/scoreboardv2?GameDate=2026-11-04&LeagueID=00&DayOffset=0" \
                   "https://api.actionnetwork.com/web/v1/scoreboard/nba?period=game&bookIds=15,30,68,69,71,75" \
                   "https://barttorvik.com/2027_team_results.json" \
                   "https://www.basketball-reference.com/leagues/NBA_2027.html" \
                   "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"; do
            code=$(curl -s -m 20 -o /tmp/b -w "%{http_code}" -A "Mozilla/5.0" -H "Referer: https://www.nba.com/" "$u"); echo "$code $(wc -c </tmp/b) $u"
          done | tee probe_result.txt
          git config user.name "edge-bot"; git config user.email "edge-bot@users.noreply.github.com"
          git add probe_result.txt && git commit -m "probe result" && git push
