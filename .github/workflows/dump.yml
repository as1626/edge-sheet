name: dump
on:
  push:
    paths: ["pipeline/dump.py", ".github/workflows/dump.yml"]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas lxml html5lib
      - run: python pipeline/dump.py || true
      - run: |
          git config user.name "edge-bot"; git config user.email "edge-bot@users.noreply.github.com"
          git add debug && git commit -m "schema dump" && git pull --rebase && git push
