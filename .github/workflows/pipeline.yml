name: pipeline
on:
  schedule:
    - cron: "17 19 * * *"   # 2:17 PM ET  card (first attempt)
    - cron: "37 20 * * *"   # 3:37 PM ET  card (retry if the first was delayed/missed)
    - cron: "30 8 * * *"    # 3:30 AM ET  grade results
    - cron: "0 14 * * *"    # 9:00 AM ET  grade (catch-up)
  push:
    paths: ["triggers/**", "pipeline/**"]
  workflow_dispatch:
    inputs:
      cmd: {description: "card | close | grade | page", default: "card"}
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas lxml html5lib
      - name: pick command
        id: cmd
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:17 19 * * *"|"schedule:37 20 * * *") c=card;;
            schedule:*) c=grade;;
            workflow_dispatch:*) c="${{ github.event.inputs.cmd }}";;
            *) c=$(cat triggers/cmd 2>/dev/null || echo page);;
          esac
          echo "cmd=$c" >> "$GITHUB_OUTPUT"; echo "running $c"
      - name: run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: python pipeline/run.py ${{ steps.cmd.outputs.cmd }}
      - name: publish
        run: |
          git config user.name "edge-bot"; git config user.email "edge-bot@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet && exit 0
          git commit -m "pipeline: ${{ steps.cmd.outputs.cmd }} $(date -u +%FT%RZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
